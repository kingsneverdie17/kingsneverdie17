<text x="810" y="28" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#0b0b0b">NASA SPACE APPS 2026 · 48 H</text>
<g class="in"><text x="40" y="86" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" letter-spacing="2" fill="#8a8a80">MARTIAN MAP · TEAM PROJECT</text><text x="38" y="148" font-family="Impact,'Anton','Oswald','Arial Black','Arial Narrow',sans-serif" font-size="62" letter-spacing="1" fill="#f4f1e6">MARS<tspan fill="#ffd400">//</tspan>404</text><text x="40" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#ffd400">Know when to turn back.</text></g>
<g class="in" style="animation-delay:.15s"><text x="40" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cfcabd">A Marswalk planner on real NASA terrain</text><text x="40" y="234" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cfcabd">(HiRISE, 1 m). It tracks oxygen, energy and</text><text x="40" y="254" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cfcabd">time out and back, marks the point of no</text><text x="40" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cfcabd">return, gives a GO / NO-GO call and places</text><text x="40" y="294" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cfcabd">radio beacons, because Mars has no GPS.</text></g>
<g class="in" style="animation-delay:.3s"><text x="40" y="332" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#f4f1e6">team member · team of 6</text><text x="40" y="352" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#8a8a80">React 19 · Three.js · Python + GDAL · 770 tests</text></g>
