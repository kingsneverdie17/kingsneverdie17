t-size="12" letter-spacing="2" fill="#ffd400">ZONE 02</text><rect x="740" y="80" width="50" height="20" fill="#ffd400" stroke="#ffd400"/><text x="765" y="94" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="700" fill="#0b0b0b">OPEN</text><text x="455" y="132" font-family="Impact,'Anton','Oswald','Arial Black','Arial Narrow',sans-serif" font-size="30" letter-spacing=".5" fill="#f4f1e6">BMI Hub</text><text x="455" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8a8a80">One service, built three times:</text><text x="455" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8a8a80">Flask, FastAPI and Django,</text><text x="455" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8a8a80">compared side by side.</text><text x="455" y="220" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#ffd400">Python · Flask · FastAPI · Django</text></g><g class="in" style="animation-delay:0.34s"><rect x="40" y="254" width="375" height="170" fill="#161616" stroke="#ffd400" stroke-width="1.6"/><text x="60" y="284" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="#ffd400">ZONE 03</text><rect x="321" y="270" width="74" height="20" fill="none" stroke="#ffd400"/><text x="358" y="284" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="700" fill="#ffd400">PRIVATE</text><text x="60" y="322" font-family="Impact,'Anton','Oswald','Arial Black','Arial Narrow',sans-serif" font-size="30" letter-spacing=".5" fill="#f4f1e6">Sidekick</text><text x="60" y="350" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8a8a80">Note-taking assistant</text><text x="60" y="370" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8a8a80">for conferences and talks.</text><text x="60" y="410" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#ffd400">assistant</text></g><g class="in" style="animation-delay:0.46s"><rect x="435" y="254" width="375" height="170" fill="none" stroke="#ffd400" stroke-width="1.6" stroke-dasharray="8 6"/><text x="455" y="284" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="#ffd400">ZONE 04</text><rect x="748" y="270" width="42" height="20" fill="none" stroke="#ffd400"/><text x="769" y="284" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="700" fill="#ffd400">WIP</text><text x="455" y="322" font-family="Impact,'Anton','Oswald','Arial Black','Arial Narrow',sans-serif" font-size="30" letter-spacing=".5" fill="#f4f1e6">Next project</text><text x="455" y="350" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8a8a80">Under construction.</text><text x="455" y="370" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8a8a80">Something new is always</text><text x="455" y="390" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8a8a80">on the way.</text><text x="455" y="410" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#ffd400">coming soon</text></g></svg>